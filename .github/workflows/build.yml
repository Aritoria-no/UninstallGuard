name: Build APK from zip

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./_src/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          GRADLE_FILE=$(find _src -name settings.gradle.kts | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "settings.gradle.kts not found in zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UninstallGuard-debug-apk
          path: _src/**/build/outputs/apk/debug/*.apk
          
